name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rescate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/rescate_test
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Crear el esquema en la base de pruebas
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/rescate_test
      - run: npm run check
      - run: npm test
